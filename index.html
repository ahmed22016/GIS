<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة متابعة متقدمي مشروع الحصر الخرائطي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#122540;
    --ink-soft:#4B5C74;
    --paper:#F5F6F8;
    --panel:#FFFFFF;
    --line:#E3E7EE;
    --brand:#0F3D5C;
    --brand-2:#155E75;
    --gold:#B98B2A;
    --gold-soft:#F4E7CC;
    --ok:#0E8F5F;
    --ok-soft:#DEF3E8;
    --bad:#C4402A;
    --bad-soft:#FBE4DF;
    --wait:#B9791A;
    --wait-soft:#FBEBD4;
    --new:#5B6B85;
    --new-soft:#E6E9EF;
    --radius:14px;
    --shadow:0 1px 2px rgba(18,37,64,.06), 0 8px 24px -12px rgba(18,37,64,.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Tajawal',Tahoma,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: -1px -1px;
  }
  h1,h2,h3,.brand-font{font-family:'Cairo',Tahoma,sans-serif;}
  .app{max-width:1180px;margin:0 auto;padding:20px 18px 60px;}
  .topbar{
    display:flex;align-items:center;justify-space:between;
    background:var(--brand);
    color:#fff;
    border-radius:var(--radius);
    padding:16px 22px;
    box-shadow:var(--shadow);
    margin-bottom:22px;
    position:relative;
    overflow:hidden;
  }
  .topbar::after{
    content:"";
    position:absolute;inset:0;
    background:radial-gradient(circle at 90% -20%, rgba(185,139,42,.35), transparent 55%);
    pointer-events:none;
  }
  .topbar .title{display:flex;align-items:center;gap:12px;position:relative;z-index:1;}
  .topbar .grid-badge{
    width:40px;height:40px;border-radius:10px;
    background:rgba(255,255,255,.12);
    display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(255,255,255,.25);
    font-family:'Cairo';font-weight:800;font-size:15px;
  }
  .topbar h1{font-size:18px;margin:0;line-height:1.3;}
  .topbar .sub{font-size:12.5px;opacity:.8;margin-top:2px;font-weight:400;}
  .topbar-actions{display:flex;gap:8px;position:relative;z-index:1;}
  .btn{
    border:none;border-radius:10px;padding:9px 16px;font-family:'Tajawal';font-weight:700;
    font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
    transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.35);}
  .btn-ghost:hover{background:rgba(255,255,255,.18);}
  .btn-primary{background:var(--gold);color:#2b1e04;}
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-outline{background:#fff;color:var(--brand);border:1px solid var(--line);}
  .btn-outline:hover{border-color:var(--brand-2);}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px;}
  .btn-danger-o{background:#fff;color:var(--bad);border:1px solid var(--bad-soft);}

  .hero{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:26px 24px;margin-bottom:22px;box-shadow:var(--shadow);
  }
  .hero h2{margin:0 0 6px;font-size:21px;}
  .hero p{margin:0;color:var(--ink-soft);font-size:14px;line-height:1.9;}
  .stat-row{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap;}
  .stat-chip{
    flex:1;min-width:130px;background:var(--paper);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;
  }
  .stat-chip .n{font-family:'Cairo';font-weight:800;font-size:22px;}
  .stat-chip .l{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .stat-chip.new .n{color:var(--new);}
  .stat-chip.ok .n{color:var(--ok);}
  .stat-chip.bad .n{color:var(--bad);}
  .stat-chip.wait .n{color:var(--wait);}

  .gov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px;}
  .gov-card{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:15px 16px;cursor:pointer;text-align:right;box-shadow:var(--shadow);
    transition:border-color .15s ease, transform .12s ease;
    position:relative;
  }
  .gov-card:hover{border-color:var(--brand-2);transform:translateY(-2px);}
  .gov-card .code{
    position:absolute;top:12px;left:12px;font-family:'Cairo';font-weight:800;
    font-size:11px;color:var(--gold);background:var(--gold-soft);
    padding:2px 7px;border-radius:6px;
  }
  .gov-card h3{margin:0 0 10px;font-size:16px;padding-left:34px;}
  .gov-card .foot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);}
  .gov-card .foot b{color:var(--ink);font-family:'Cairo';}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px;}
  .ws-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .ws-head h2{margin:0;font-size:19px;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .input, select.input{
    border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-family:'Tajawal';
    font-size:13.5px;background:#fff;color:var(--ink);
  }
  .input:focus, select.input:focus{outline:2px solid var(--brand-2);outline-offset:1px;}
  .search-wrap{flex:1;min-width:220px;}
  .search-wrap input{width:100%;}

  table{width:100%;border-collapse:collapse;font-size:13.2px;}
  thead th{
    text-align:right;color:var(--ink-soft);font-weight:700;font-size:12px;
    padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap;
  }
  tbody td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:hover{background:#FAFBFD;}
  .nm{font-weight:700;}
  .muted{color:var(--ink-soft);font-size:12px;}
  .badge{
    display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;
    font-size:11.5px;font-weight:700;white-space:nowrap;
  }
  .badge.done{background:var(--ok-soft);color:var(--ok);}
  .badge.pending{background:var(--new-soft);color:var(--new);}
  .status-select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:'Tajawal';font-size:12.3px;background:#fff;min-width:132px;}
  .icon-btn{
    border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);
  }
  .icon-btn:hover{border-color:var(--brand-2);color:var(--brand-2);}
  .manual-tag{font-size:10px;background:var(--gold-soft);color:var(--gold);padding:2px 6px;border-radius:6px;margin-right:5px;}
  .empty-state{padding:40px 10px;text-align:center;color:var(--ink-soft);}
  .pagination{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:14px;font-size:13px;}

  .overlay{
    position:fixed;inset:0;background:rgba(18,37,64,.45);display:none;
    align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50;
  }
  .overlay.open{display:flex;}
  .modal{background:#fff;border-radius:16px;max-width:560px;width:100%;padding:22px;box-shadow:0 24px 60px -20px rgba(0,0,0,.4);}
  .modal h3{margin:0 0 14px;font-size:17px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;}
  .form-grid .full{grid-column:1/-1;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-weight:700;}
  .field .input, .field select, .field textarea{width:100%;}
  .field textarea{resize:vertical;min-height:60px;font-family:'Tajawal';border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13.5px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .modal-section{font-family:'Cairo';font-weight:800;font-size:12.5px;color:var(--brand-2);margin:16px 0 8px;padding-top:12px;border-top:1px dashed var(--line);grid-column:1/-1;}
  .modal-section:first-of-type{margin-top:0;padding-top:0;border-top:none;}
  .skills-grid{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .skills-grid label{display:flex;align-items:center;gap:7px;font-size:12.8px;font-weight:400;color:var(--ink);cursor:pointer;}
  .skills-grid input[type=checkbox]{width:15px;height:15px;accent-color:var(--brand-2);cursor:pointer;}

  .login-wrap{min-height:90vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:34px 30px;max-width:400px;width:100%;position:relative;overflow:hidden;}
  .login-card::before{content:"";position:absolute;top:0;right:0;left:0;height:5px;background:linear-gradient(90deg,var(--brand),var(--gold));}
  .login-card .grid-badge{width:46px;height:46px;background:var(--brand);color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Cairo';font-weight:800;margin-bottom:14px;}
  .login-card h2{margin:0 0 4px;font-size:19px;}
  .login-card p{margin:0 0 20px;color:var(--ink-soft);font-size:13px;}
  .login-card .field{margin-bottom:12px;}
  .login-card .err{color:var(--bad);font-size:12.5px;margin-bottom:10px;min-height:16px;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:13.5px;
    opacity:0;transition:all .25s ease;pointer-events:none;z-index:99;display:flex;align-items:center;gap:8px;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.ok{background:#0E4C36;}
  .toast.err{background:#5C1F16;}

  .dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);}
  .kpi .n{font-family:'Cairo';font-weight:800;font-size:26px;}
  .kpi .l{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .dash-table th, .dash-table td{font-size:12.6px;}
  .bar-track{background:var(--new-soft);border-radius:5px;height:9px;overflow:hidden;display:flex;min-width:120px;}
  .bar-track span{height:100%;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);margin-bottom:10px;}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px;position:relative;top:1px;}
  .auto-note{font-size:11.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
  .pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite;}
  @keyframes pulse{0%{opacity:1;}50%{opacity:.3;}100%{opacity:1;}}

  @media(max-width:720px){
    .form-grid{grid-template-columns:1fr;}
    .dash-grid{grid-template-columns:repeat(2,1fr);}
    .topbar{flex-direction:column;align-items:flex-start;gap:12px;}
  }
</style>
</head>
<body>
<div class="app" id="app"><div class="empty-state">جارِ التحميل...</div></div>
<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><div class="modal" id="modalBox"></div></div>

<script>
/* ============ 1. إعداد Supabase ============ */
const SUPABASE_URL = 'https://rbtnwqdwccvuxhyxwszp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJidG53cWR3Y2N2dXhoeXh3c3pwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NjI2MzYsImV4cCI6MjEwMzQzODYzNn0.UmUaEbtpFusODGF8dsheYUKjRQN36XeWiC3mxD_AxK8';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ============ 2. الثوابت والقوائم ============ */
let GOVS_LIST = [];
const QUALS = [
  'ليسانس آداب (خرائط - مساحة - نظم معلومات جغرافية - GIS)',
  'بكالوريوس هندسة (مدني - عمارة)',
  'تخصص ذات علاقة بنظم المعلومات الجغرافية',
  'التخطيط العمرانى',
  'معهد مساحه',
  'مؤهلات اخرى'
];
const STATUS = {
  'جديد':      {label:'لم يتم التواصل بعد', color:'var(--new)'},
  'مهتم':      {label:'يرغب فى العمل',        color:'var(--ok)'},
  'غير مهتم':  {label:'لا يرغب فى العمل',      color:'var(--bad)'},
  'لا يرد':    {label:'لم يتم الرد',           color:'var(--wait)'}
};
const STATUS_ORDER = ['جديد','مهتم','غير مهتم','لا يرد'];
const SKILLS_LIST = [
  'المساحة الأرضية',
  'نظم المعلومات الجغرافية (GIS)',
  'استخدام الأجهزة اللوحية / GPS',
  'إدخال البيانات (Data Entry)',
  'التصوير الجوى / الطائرات المسيرة',
  'التحليل الإحصائى للبيانات',
  'أعمال الحصر الميدانى والتعداد السكانى',
  'اللغة الإنجليزية',
  'مهارات الحاسب الآلى (Office)',
  'القيادة وإدارة الفرق'
];
const YESNO = ['نعم','لا'];
const districtsCache = {};

/* ============ 3. حالة التطبيق ============ */
let currentUser = null;    
let currentGov = null;     
let currentApplicants = [];
let searchTerm = '';
let statusFilter = 'all';
let districtFilter = 'all';
let interviewFilter = 'all';
let page = 1;
const PAGE_SIZE = 40;
let loginError = '';

/* ============ 4. الدوال المساعدة ============ */
function toast(msg, kind){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (kind||'');
  clearTimeout(t._h);
  t._h = setTimeout(()=>{ t.className='toast'; }, 2600);
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
async function loadGovernorates(){
  const { data, error } = await sb.from('governorates').select('*').order('gov_code',{ascending:true});
  if(error){ toast('تعذر تحميل المحافظات: '+error.message, 'err'); GOVS_LIST = []; return; }
  GOVS_LIST = (data||[]).map(g=>({code:String(g.gov_code), name:g.gov_name}));
}
async function districtsForGov(govName){
  if(districtsCache[govName]) return districtsCache[govName];
  const { data, error } = await sb.from('districts').select('district_name').eq('governorate', govName).order('district_name',{ascending:true});
  const list = error ? [] : (data||[]).map(d=>d.district_name);
  districtsCache[govName] = list;
  return list;
}
function govInfoByName(name){ return GOVS_LIST.find(g=>g.name===name); }

/* ============ 5. تسجيل الدخول ============ */
async function attemptLogin(email, password){
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ loginError = 'البريد الإلكترونى أو كلمة المرور غير صحيحة'; return false; }
  return await loadCurrentProfile();
}
async function loadCurrentProfile(){
  const { data: sess } = await sb.auth.getSession();
  const authUser = sess && sess.session ? sess.session.user : null;
  if(!authUser) return false;
  const { data, error } = await sb.from('profiles').select('*').eq('id', authUser.id).maybeSingle();
  if(error || !data) return false;
  currentUser = { id: authUser.id, email: authUser.email, role: data.role, governorate: data.governorate };
  return true;
}
async function changePasswordFlow(){
  const p1 = prompt('أدخل كلمة المرور الجديدة (6 أحرف على الأقل):');
  if(!p1) return;
  if(p1.length<6){ toast('كلمة المرور قصيرة جداً', 'err'); return; }
  const p2 = prompt('أعد إدخال كلمة المرور للتأكيد:');
  if(p1!==p2){ toast('كلمتا المرور غير متطابقتين', 'err'); return; }
  const { error } = await sb.auth.updateUser({ password: p1 });
  if(error){ toast('تعذر تغيير كلمة المرور: '+error.message, 'err'); return; }
  toast('تم تغيير كلمة المرور بنجاح', 'ok');
}
async function logout(){
  await sb.auth.signOut();
  currentUser = null;
  currentGov = null;
  render();
}
function renderLogin(){
  document.getElementById('app').innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <div class="grid-badge">GIS</div>
        <h2>منصة متابعة متقدمي مشروع الحصر الخرائطي</h2>
        <p>سجّل الدخول بحساب مسؤول المحافظة أو حساب المشرف العام</p>
        <div class="err">${esc(loginError)}</div>
        <div class="field"><input class="input" id="loginUser" placeholder="البريد الإلكترونى" style="width:100%;"></div>
        <div class="field"><input class="input" id="loginPass" type="password" placeholder="كلمة المرور" style="width:100%;"></div>
        <button class="btn btn-primary" id="btnLogin" style="width:100%;justify-content:center;">تسجيل الدخول</button>
      </div>
    </div>
  `;
  const doLogin = async ()=>{
    const u = document.getElementById('loginUser').value.trim();
    const p = document.getElementById('loginPass').value;
    if(!u || !p){ loginError='يرجى إدخال البريد الإلكترونى وكلمة المرور'; renderLogin(); return; }
    document.getElementById('btnLogin').textContent = 'جارِ التحقق...';
    if(await attemptLogin(u,p)) render(); else renderLogin();
  };
  document.getElementById('btnLogin').onclick = doLogin;
  document.getElementById('loginPass').onkeydown = (e)=>{ if(e.key==='Enter') doLogin(); };
}

/* ============ 6. التنقل والرئيسية ============ */
async function render(){
  if(GOVS_LIST.length===0) await loadGovernorates();
  if(!currentUser){
    if(!await loadCurrentProfile()){ renderLogin(); return; }
  }
  if(currentUser.role==='gov' && !currentGov){
    openGov(currentUser.governorate);
    return;
  }
  if(!currentGov){
    document.getElementById('app').innerHTML = '<div class="empty-state">جارِ تحميل الإحصائيات...</div>';
    await renderLanding();
  }
}

async function renderLanding(){
  const { data } = await sb.from('applicants').select('governorate,status,interview_done');
  const rows = data || [];
  const byGov = {};
  rows.forEach(r=>{
    if(!byGov[r.governorate]) byGov[r.governorate] = {total:0, interested:0, interviewed:0};
    byGov[r.governorate].total++;
    if(r.status==='مهتم') byGov[r.governorate].interested++;
    if(r.interview_done) byGov[r.governorate].interviewed++;
  });

  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <div class="title">
        <div class="grid-badge">GIS</div>
        <div>
          <h1>منصة متابعة متقدمي مشروع الحصر الخرائطي</h1>
          <div class="sub">مسجّل الدخول: ${esc(currentUser.email)} (مشرف عام)</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary" id="btnDash">لوحة المتابعة العامة</button>
        <button class="btn btn-ghost" id="btnExportAll">⬇ تصدير Excel الشامل</button>
        <button class="btn btn-ghost" id="btnChangePass">🔑 كلمة المرور</button>
        <button class="btn btn-ghost" id="btnLogout">خروج</button>
      </div>
    </div>

    <div class="hero">
      <h2>اختر المحافظة للعرض والتعديل</h2>
      <p>تتم مزامنة كافة البيانات والتقارير بشكل حى ومباشر مع قاعدة بيانات النظام.</p>
    </div>

    <div class="gov-grid">
      ${GOVS_LIST.map(g=>{
        const c = byGov[g.name] || {total:0,interested:0,interviewed:0};
        return `
        <div class="gov-card" data-name="${esc(g.name)}">
          <div class="code">${esc(g.code)}</div>
          <h3>${esc(g.name)}</h3>
          <div class="foot"><span>إجمالي المتقدمين</span><b>${c.total}</b></div>
        </div>`;
      }).join('')}
    </div>
  `;
  document.getElementById('btnDash').onclick = openDashboard;
  document.getElementById('btnExportAll').onclick = exportAllToExcel;
  document.getElementById('btnLogout').onclick = logout;
  document.getElementById('btnChangePass').onclick = changePasswordFlow;
  document.querySelectorAll('.gov-card').forEach(el=> el.onclick = ()=> openGov(el.dataset.name));
}

/* ============ 7. مساحة عمل المحافظة ============ */
async function openGov(govName){
  currentGov = govName;
  searchTerm=''; statusFilter='all'; districtFilter='all'; interviewFilter='all'; page=1;
  document.getElementById('app').innerHTML = `<div class="empty-state">جارِ تحميل بيانات المحافظة...</div>`;
  const { data, error } = await sb.from('applicants').select('*').eq('governorate', govName).order('id',{ascending:true});
  if(error) toast('تعذر تحميل البيانات: '+error.message, 'err');
  currentApplicants = data || [];
  renderWorkspace();
}

function renderWorkspace(){
  const govInfo = govInfoByName(currentGov);
  const c = {'جديد':0,'مهتم':0,'غير مهتم':0,'لا يرد':0};
  currentApplicants.forEach(a=> c[a.status] = (c[a.status]||0)+1);
  const interviewedCount = currentApplicants.filter(a=>a.interview_done).length;
  const districts = Array.from(new Set(currentApplicants.map(a=>a.district).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'ar'));

  let filtered = currentApplicants.filter(a=>{
    if(statusFilter!=='all' && a.status!==statusFilter) return false;
    if(districtFilter!=='all' && a.district!==districtFilter) return false;
    if(interviewFilter==='done' && !a.interview_done) return false;
    if(interviewFilter==='pending' && a.interview_done) return false;
    if(searchTerm){
      const s = searchTerm.trim();
      if(!((a.full_name||'').includes(s) || (a.national_id||'').includes(s) || (a.phone||'').includes(s))) return false;
    }
    return true;
  });
  const totalPages = Math.max(1, Math.ceil(filtered.length/PAGE_SIZE));
  if(page>totalPages) page = totalPages;
  const pageItems = filtered.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);

  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <div class="title">
        <div class="grid-badge">${esc(govInfo?govInfo.code:'')}</div>
        <div>
          <h1>محافظة ${esc(currentGov)}</h1>
          <div class="sub">المستخدم: ${esc(currentUser.email)}</div>
        </div>
      </div>
      <div class="topbar-actions">
        ${currentUser.role==='admin'? `<button class="btn btn-ghost" id="btnBack">↩ المحافظات</button>` : `<button class="btn btn-ghost" id="btnBack">خروج</button>`}
        <button class="btn btn-primary" id="btnDistrictReport">📊 تقارير المراكز والأقسام</button>
        <button class="btn btn-ghost" id="btnExportGov">⬇ تصدير Excel</button>
        <button class="btn btn-ghost" id="btnChangePass">🔑 كلمة المرور</button>
        <button class="btn btn-primary" id="btnAdd" style="background:#fff;color:var(--brand);">+ متقدم جديد</button>
      </div>
    </div>

    <div class="panel">
      <div class="stat-row">
        <div class="stat-chip new"><div class="n">${c['جديد']}</div><div class="l">${STATUS['جديد'].label}</div></div>
        <div class="stat-chip ok"><div class="n">${c['مهتم']}</div><div class="l">${STATUS['مهتم'].label}</div></div>
        <div class="stat-chip bad"><div class="n">${c['غير مهتم']}</div><div class="l">${STATUS['غير مهتم'].label}</div></div>
        <div class="stat-chip wait"><div class="n">${c['لا يرد']}</div><div class="l">${STATUS['لا يرد'].label}</div></div>
        <div class="stat-chip ok"><div class="n">${interviewedCount}</div><div class="l">تمت المقابلة (منذ البدء)</div></div>
      </div>
    </div>

    <div class="panel">
      <div class="ws-head"><h2>سجل المتقدمين (${filtered.length} من أصل ${currentApplicants.length})</h2></div>
      <div class="toolbar">
        <div class="search-wrap"><input class="input" id="searchBox" placeholder="بحث بالاسم أو الرقم القومي أو الهاتف" value="${esc(searchTerm)}"></div>
        <select class="input" id="statusFilterSel">
          <option value="all">كل الحالات</option>
          ${STATUS_ORDER.map(k=>`<option value="${k}" ${statusFilter===k?'selected':''}>${STATUS[k].label}</option>`).join('')}
        </select>
        <select class="input" id="districtFilterSel">
          <option value="all">كل المراكز / الأقسام</option>
          ${districts.map(d=>`<option value="${esc(d)}" ${districtFilter===d?'selected':''}>${esc(d)}</option>`).join('')}
        </select>
        <select class="input" id="interviewFilterSel">
          <option value="all">المقابلة الميدانية</option>
          <option value="done" ${interviewFilter==='done'?'selected':''}>تمت المقابلة</option>
          <option value="pending" ${interviewFilter==='pending'?'selected':''}>لم تتم</option>
        </select>
      </div>

      ${pageItems.length? `
      <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>الاسم</th><th>الرقم القومي</th><th>رقم الهاتف</th><th>المركز / القسم</th><th>المؤهل</th><th>حالة التواصل</th><th>المقابلة</th><th>تعديل</th></tr></thead>
        <tbody>
          ${pageItems.map(a=>`
            <tr>
              <td><span class="nm">${esc(a.full_name)}</span>${a.manual?'<span class="manual-tag">مضاف يدوياً</span>':''}</td>
              <td class="muted">${esc(a.national_id)}</td>
              <td class="muted">${esc(a.phone)}</td>
              <td class="muted">${esc(a.district||'غير محدد')}</td>
              <td class="muted">${esc(a.qualification||'')}</td>
              <td>
                <select class="status-select" data-id="${a.id}">
                  ${STATUS_ORDER.map(k=>`<option value="${k}" ${a.status===k?'selected':''}>${STATUS[k].label}</option>`).join('')}
                </select>
              </td>
              <td><span class="badge ${a.interview_done?'done':'pending'}">${a.interview_done?'منجزة':'لم تتم'}</span></td>
              <td><button class="icon-btn" data-edit="${a.id}" title="تعديل">✎</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      </div>
      <div class="pagination">
        <button class="btn btn-outline btn-sm" id="prevPage" ${page<=1?'disabled':''}>السابق</button>
        <span>صفحة ${page} من ${totalPages}</span>
        <button class="btn btn-outline btn-sm" id="nextPage" ${page>=totalPages?'disabled':''}>التالي</button>
      </div>
      ` : `<div class="empty-state">لا توجد نتائج مطابقة لخيارات الفلترة</div>`}
    </div>
  `;

  document.getElementById('btnBack').onclick = ()=>{ if(currentUser.role==='admin'){ currentGov=null; render(); } else { logout(); } };
  document.getElementById('btnDistrictReport').onclick = openDistrictReport;
  document.getElementById('btnExportGov').onclick = ()=> exportToExcel(currentApplicants, currentGov);
  document.getElementById('btnChangePass').onclick = changePasswordFlow;
  document.getElementById('btnAdd').onclick = ()=> openApplicantModal(null);
  document.getElementById('searchBox').oninput = (e)=>{ searchTerm=e.target.value; page=1; renderWorkspace(); };
  document.getElementById('statusFilterSel').onchange = (e)=>{ statusFilter=e.target.value; page=1; renderWorkspace(); };
  document.getElementById('districtFilterSel').onchange = (e)=>{ districtFilter=e.target.value; page=1; renderWorkspace(); };
  document.getElementById('interviewFilterSel').onchange = (e)=>{ interviewFilter=e.target.value; page=1; renderWorkspace(); };
  const prevBtn=document.getElementById('prevPage'); if(prevBtn) prevBtn.onclick=()=>{page--;renderWorkspace();};
  const nextBtn=document.getElementById('nextPage'); if(nextBtn) nextBtn.onclick=()=>{page++;renderWorkspace();};

  document.querySelectorAll('.status-select').forEach(sel=>{
    sel.onchange = async (e)=>{
      const id = e.target.dataset.id;
      const { error } = await sb.from('applicants').update({status:e.target.value, updated_at:new Date().toISOString()}).eq('id', id);
      if(error){ toast('تعذر التحديث: '+error.message, 'err'); return; }
      const a = currentApplicants.find(x=>String(x.id)===String(id));
      if(a) a.status = e.target.value;
      toast('تم تحديث حالة التواصل بنجاح', 'ok');
      renderWorkspace();
    };
  });
  document.querySelectorAll('[data-edit]').forEach(btn=> btn.onclick = ()=> openApplicantModal(btn.dataset.edit));
}

/* ============ 8. شاشة تقارير الأقسام / المراكز (جديدة ومُضافة) ============ */
async function openDistrictReport(){
  const govInfo = govInfoByName(currentGov);
  document.getElementById('app').innerHTML = `<div class="empty-state">جارِ إعداد تقارير الأقسام والمراكز...</div>`;

  // تجميع وتصنيف البيانات بناءً على الأقسام/المراكز
  const byDistrict = {};
  let unassignedCount = 0;

  currentApplicants.forEach(a=>{
    const d = a.district ? a.district.trim() : 'غير محدد';
    if(!a.district) unassignedCount++;
    if(!byDistrict[d]) {
      byDistrict[d] = { total:0, new:0, ok:0, bad:0, wait:0, interviewed:0 };
    }
    const dist = byDistrict[d];
    dist.total++;
    if(a.status==='جديد') dist.new++;
    if(a.status==='مهتم') dist.ok++;
    if(a.status==='غير مهتم') dist.bad++;
    if(a.status==='لا يرد') dist.wait++;
    if(a.interview_done) dist.interviewed++;
  });

  const sortedDistricts = Object.keys(byDistrict).sort((a,b)=> byDistrict[b].total - byDistrict[a].total);

  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <div class="title">
        <div class="grid-badge">🏢</div>
        <div>
          <h1>تقرير تصنيف المراكز والأقسام - محافظة ${esc(currentGov)}</h1>
          <div class="sub">تحليل استجابة المتقدمين والمقابلات الميدانية حسب المركز/القسم</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost" id="btnBackToGov">↩ العودة للجدول الرئيسي</button>
        <button class="btn btn-primary" id="btnExportDistricts">⬇ تصدير التقرير Excel</button>
      </div>
    </div>

    <div class="dash-grid">
      <div class="kpi"><div class="n">${currentApplicants.length}</div><div class="l">إجمالي متقدمي المحافظة</div></div>
      <div class="kpi"><div class="n" style="color:var(--brand-2);">${sortedDistricts.length}</div><div class="l">عدد الأقسام / المراكز المسجلة</div></div>
      <div class="kpi"><div class="n" style="color:var(--ok);">${currentApplicants.filter(r=>r.status==='مهتم').length}</div><div class="l">إجمالي المهتمين بالعمل</div></div>
      <div class="kpi"><div class="n" style="color:var(--gold);">${currentApplicants.filter(r=>r.interview_done).length}</div><div class="l">إجمالي من تم مقابلتهم</div></div>
    </div>

    <div class="panel">
      <div class="ws-head">
        <h2>تفاصيل توزيع المتقدمين حسَب المركز / القسم</h2>
        <div class="auto-note"><span class="pulse"></span> تحديث تلقائي حى</div>
      </div>

      <div class="legend">
        <span><i style="background:var(--ok);"></i> مهتم</span>
        <span><i style="background:var(--wait);"></i> لا يرد</span>
        <span><i style="background:var(--bad);"></i> غير مهتم</span>
        <span><i style="background:var(--new);"></i> جديد</span>
      </div>

      <div style="overflow-x:auto;">
      <table class="dash-table">
        <thead>
          <tr>
            <th>اسم القسم / المركز</th>
            <th>إجمالي المتقدمين</th>
            <th>جديد</th>
            <th>مهتم بالعمل</th>
            <th>غير مهتم</th>
            <th>لا يرد</th>
            <th>تمت المقابلة</th>
            <th>شريط توزيع الاستجابة</th>
          </tr>
        </thead>
        <tbody>
          ${sortedDistricts.map(distName=>{
            const d = byDistrict[distName];
            const pNew = d.total? (d.new/d.total*100):0;
            const pOk = d.total? (d.ok/d.total*100):0;
            const pBad = d.total? (d.bad/d.total*100):0;
            const pWait = d.total? (d.wait/d.total*100):0;

            return `
              <tr>
                <td><b>${esc(distName)}</b></td>
                <td><b>${d.total}</b></td>
                <td>${d.new}</td>
                <td><span style="color:var(--ok);font-weight:800;">${d.ok}</span></td>
                <td>${d.bad}</td>
                <td>${d.wait}</td>
                <td><b>${d.interviewed}</b></td>
                <td>
                  <div class="bar-track" title="توزيع الاستجابة بالمركز">
                    <span style="width:${pOk}%;background:var(--ok);"></span>
                    <span style="width:${pWait}%;background:var(--wait);"></span>
                    <span style="width:${pBad}%;background:var(--bad);"></span>
                    <span style="width:${pNew}%;background:var(--new);"></span>
                  </div>
                </td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
      </div>
    </div>
  `;

  document.getElementById('btnBackToGov').onclick = ()=> openGov(currentGov);
  document.getElementById('btnExportDistricts').onclick = ()=>{
    const expData = sortedDistricts.map((dName, idx)=>({
      'م': idx+1,
      'المركز / القسم': dName,
      'إجمالي المتقدمين': byDistrict[dName].total,
      'جديد': byDistrict[dName].new,
      'مهتم (يرغب بالعمل)': byDistrict[dName].ok,
      'غير مهتم': byDistrict[dName].bad,
      'لا يرد': byDistrict[dName].wait,
      'تمت مقابلته الميدانية': byDistrict[dName].interviewed
    }));
    const ws = XLSX.utils.json_to_sheet(expData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "تقرير المراكز");
    XLSX.writeFile(wb, `تقرير_مراكز_${currentGov}_${new Date().toISOString().slice(0,10)}.xlsx`);
    toast('تم تصدير تقرير الأقسام والمراكز بنجاح', 'ok');
  };
}

/* ============ 9. نافذة إضافة وتعديل متقدم ============ */
async function openApplicantModal(id){
  const app = id ? currentApplicants.find(x=>String(x.id)===String(id)) : null;
  const distList = await districtsForGov(currentGov);
  const userSkills = app && Array.isArray(app.skills) ? app.skills : [];

  const overlay = document.getElementById('overlay');
  const box = document.getElementById('modalBox');

  let distOptions = `<option value="">اختر القسم / المركز</option>`;
  if(app && app.district && !distList.includes(app.district)){
    distOptions += `<option value="${esc(app.district)}" selected>${esc(app.district)}</option>`;
  }
  distList.forEach(d=>{
    distOptions += `<option value="${esc(d)}" ${app&&app.district===d?'selected':''}>${esc(d)}</option>`;
  });

  box.innerHTML = `
    <h3>${app?'تعديل بيانات المتقدم':'إضافة متقدم جديد'}</h3>
    <form id="appForm">
      <div class="form-grid">
        <div class="modal-section">البيانات الأساسية</div>
        <div class="field full"><label>الاسم بالكامل *</label><input class="input" id="m_full_name" value="${esc(app?app.full_name:'')}" required></div>
        <div class="field"><label>الرقم القومى *</label><input class="input" id="m_national_id" value="${esc(app?app.national_id:'')}" required maxlength="14"></div>
        <div class="field"><label>رقم الهاتف *</label><input class="input" id="m_phone" value="${esc(app?app.phone:'')}" required></div>
        <div class="field"><label>القسم / المركز</label><select class="input" id="m_district">${distOptions}</select></div>
        <div class="field full"><label>المؤهل الدراسي</label>
          <select class="input" id="m_qualification">
            <option value="">اختر المؤهل</option>
            ${QUALS.map(q=>`<option value="${esc(q)}" ${app&&app.qualification===q?'selected':''}>${esc(q)}</option>`).join('')}
          </select>
        </div>
        
        <div class="modal-section">المتابعة والمقابلة الميدانية</div>
        <div class="field"><label>حالة التواصل</label>
          <select class="input" id="m_status">
            ${STATUS_ORDER.map(k=>`<option value="${k}" ${app&&app.status===k?'selected':''}>${STATUS[k].label}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>إنجاز المقابلة الميدانية؟</label>
          <select class="input" id="m_interview_done">
            <option value="false" ${!app||!app.interview_done?'selected':''}>لا</option>
            <option value="true" ${app&&app.interview_done?'selected':''}>نعم</option>
          </select>
        </div>

        <div class="modal-section">تقييم المهارات الميدانية</div>
        <div class="skills-grid">
          ${SKILLS_LIST.map(s=>`
            <label><input type="checkbox" name="m_skills" value="${esc(s)}" ${userSkills.includes(s)?'checked':''}> ${esc(s)}</label>
          `).join('')}
        </div>

        <div class="modal-section">ملاحظات التقييم</div>
        <div class="field full"><label>ملاحظات مسؤل المتابعة</label><textarea id="m_notes">${esc(app?app.notes:'')}</textarea></div>
      </div>

      <div class="modal-actions">
        ${app?`<button type="button" class="btn btn-danger-o" id="btnDeleteApp">حذف المتقدم</button>`:''}
        <button type="button" class="btn btn-outline" id="btnCancelApp">إلغاء</button>
        <button type="submit" class="btn btn-primary">حفظ</button>
      </div>
    </form>
  `;

  overlay.classList.add('open');
  document.getElementById('btnCancelApp').onclick = ()=>{ overlay.classList.remove('open'); };

  if(app){
    document.getElementById('btnDeleteApp').onclick = async ()=>{
      if(!confirm('هل تريد حذف هذا المتقدم نهائياً؟')) return;
      const { error } = await sb.from('applicants').delete().eq('id', app.id);
      if(error){ toast('تعذر الحذف: '+error.message, 'err'); return; }
      toast('تم حذف المتقدم بنجاح', 'ok');
      overlay.classList.remove('open');
      openGov(currentGov);
    };
  }

  document.getElementById('appForm').onsubmit = async (e)=>{
    e.preventDefault();
    const skills = Array.from(document.querySelectorAll('input[name="m_skills"]:checked')).map(cb=>cb.value);
    
    const payload = {
      full_name: document.getElementById('m_full_name').value.trim(),
      national_id: document.getElementById('m_national_id').value.trim(),
      phone: document.getElementById('m_phone').value.trim(),
      district: document.getElementById('m_district').value,
      qualification: document.getElementById('m_qualification').value,
      governorate: currentGov,
      status: document.getElementById('m_status').value,
      interview_done: document.getElementById('m_interview_done').value === 'true',
      skills: skills,
      notes: document.getElementById('m_notes').value.trim(),
      updated_at: new Date().toISOString()
    };

    if(app){
      const { error } = await sb.from('applicants').update(payload).eq('id', app.id);
      if(error){ toast('تعذر التعديل: '+error.message, 'err'); return; }
      toast('تم التعديل بنجاح', 'ok');
    } else {
      payload.manual = true;
      const { error } = await sb.from('applicants').insert([payload]);
      if(error){ toast('تعذر الإضافة: '+error.message, 'err'); return; }
      toast('تمت الإضافة بنجاح', 'ok');
    }

    overlay.classList.remove('open');
    openGov(currentGov);
  };
}

/* ============ 10. لوحة المتابعة العامة للمحافظات (Dashboard) ============ */
async function openDashboard(){
  currentGov = '__dashboard__';
  document.getElementById('app').innerHTML = `<div class="empty-state">جارِ تحميل بيانات اللوحة العامة...</div>`;
  const { data, error } = await sb.from('applicants').select('*');
  if(error){ toast('تعذر التحميل: '+error.message, 'err'); return; }
  
  const rows = data || [];
  const byGov = {};
  GOVS_LIST.forEach(g=> byGov[g.name] = {total:0, new:0, ok:0, bad:0, wait:0, interviewed:0});

    if(r.status==='لا يرد') g.wait++;

        <div>
          <h1>لوحة المتابعة الإحصائية العامة</h1>
          <div class="sub">توزيع المتقدمين على مستوى كافة المحافظات</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost" id="btnBackDash">↩ قائمة المحافظات</button>
        <button class="btn btn-ghost" id="btnExportAllDash">⬇ تصدير Excel الشامل</button>
      </div>
    </div>

    <div class="dash-grid">
      <div class="kpi"><div class="n">${rows.length}</div><div class="l">إجمالي المتقدمين</div></div>
      <div class="kpi"><div class="n" style="color:var(--ok);">${rows.filter(r=>r.status==='مهتم').length}</div><div class="l">المتقدمين المهتمين</div></div>
      <div class="kpi"><div class="n" style="color:var(--brand-2);">${rows.filter(r=>r.interview_done).length}</div><div class="l">تمت مقابلتهم</div></div>
      <div class="kpi"><div class="n" style="color:var(--gold);">${GOVS_LIST.length}</div><div class="l">إجمالي المحافظات</div></div>
    </div>

    <div class="panel">
      <div class="ws-head">
        <h2>توزيع استجابة المتقدمين بالمحافظات</h2>
      </div>

      <div style="overflow-x:auto;">
      <table class="dash-table">
        <thead>
          <tr>
            <th>المحافظة</th>
            <th>الإجمالي</th>
            <th>جديد</th>
            <th>مهتم</th>
            <th>غير مهتم</th>
            <th>لا يرد</th>
            <th>تمت المقابلة</th>
            <th>نسب التوزيع</th>
          </tr>
        </thead>
        <tbody>
          ${GOVS_LIST.map(g=>{
            const stat = byGov[g.name] || {total:0, new:0, ok:0, bad:0, wait:0, interviewed:0};
            const pNew = stat.total? (stat.new/stat.total*100):0;
            const pOk = stat.total? (stat.ok/stat.total*100):0;
            const pBad = stat.total? (stat.bad/stat.total*100):0;
            const pWait = stat.total? (stat.wait/stat.total*100):0;

            return `
              <tr>
                <td><b>${esc(g.name)}</b></td>
                <td><b>${stat.total}</b></td>
                <td>${stat.new}</td>
                <td><span style="color:var(--ok);font-weight:700;">${stat.ok}</span></td>
                <td>${stat.bad}</td>
                <td>${stat.wait}</td>
                <td><b>${stat.interviewed}</b></td>
                <td>
                  <div class="bar-track">
                    <span style="width:${pOk}%;background:var(--ok);"></span>
                    <span style="width:${pWait}%;background:var(--wait);"></span>
                    <span style="width:${pBad}%;background:var(--bad);"></span>
                    <span style="width:${pNew}%;background:var(--new);"></span>
                  </div>
                </td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
      </div>
    </div>
  `;

  document.getElementById('btnBackDash').onclick = ()=>{ currentGov=null; render(); };
  document.getElementById('btnExportAllDash').onclick = exportAllToExcel;
}

/* ============ 11. التصدير لإكسيل ============ */
function exportToExcel(rows, filename){
  if(!rows || !rows.length){ toast('لا توجد بيانات للتصدير', 'err'); return; }
  const excelData = rows.map((r, i)=>({
    'م': i+1,
    'الاسم بالكامل': r.full_name || '',
    'الرقم القومي': r.national_id || '',
    'الهاتف': r.phone || '',
    'المحافظة': r.governorate || '',
    'المركز/القسم': r.district || '',
    'المؤهل الدراسي': r.qualification || '',
    'حالة التواصل': STATUS[r.status] ? STATUS[r.status].label : r.status,
    'المقابلة الميدانية': r.interview_done ? 'تمت المقابلة' : 'لم تمت',
    'المهارات': Array.isArray(r.skills) ? r.skills.join(' - ') : '',
    'ملاحظات': r.notes || ''
  }));

  const ws = XLSX.utils.json_to_sheet(excelData);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "البيانات");
  XLSX.writeFile(wb, `${filename}_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('تم التصدير بنجاح', 'ok');
}

async function exportAllToExcel(){
  toast('جارِ تجميع البيانات للتصدير...', 'ok');
  const { data, error } = await sb.from('applicants').select('*').order('governorate',{ascending:true});
  if(error){ toast('تعذر التصدير: '+error.message, 'err'); return; }
  exportToExcel(data, 'كافة_المحافظات');
}

/* ============ 12. التشغيل عند التحميل ============ */
window.addEventListener('DOMContentLoaded', ()=>{ render(); });
</script>
